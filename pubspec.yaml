name: prewatch
description: Simple 2x2 dashboard for Echo Show 5
publish_to: 'none'
version: 4.1.4+13

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  intl: ^0.20.3
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/miracle.wav
    - assets/eclair.wav
    - assets/alcana.wav
    - assets/all.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFB6C1"
  adaptive_icon_foreground: "assets/icon.png"