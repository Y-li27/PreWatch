name: PreWatch
description: Simple 2x2 dashboard for Echo Show 5
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  intl: ^0.20.3
  image_picker: ^1.1.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/wakeuptime.wav

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"   # 添付画像をこの名前で保存
  adaptive_icon_background: "#FFB6C1"
  adaptive_icon_foreground: "assets/icon.png"